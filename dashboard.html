<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Premium Dashboard</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><header><h2>📚 Premium Dashboard</h2><a href="index.html">Home</a></header><main><div id="userBox"></div><section id="plans"><h1>Premium Plans</h1><div class="plans"><div class="plan"><h2>1 Year</h2><h3>₹20</h3><p>Access for 1 year</p><button onclick="buyPlan('1year',20)">Buy Now</button></div><div class="plan"><h2>5 Years</h2><h3>₹100</h3><p>Access for 5 years</p><button onclick="buyPlan('5year',100)">Buy Now</button></div><div class="plan"><h2>10 Years</h2><h3>₹150</h3><p>Access for 10 years</p><button onclick="buyPlan('10year',150)">Buy Now</button></div></div></section><section id="premiumSearch" style="display:none"><h2>🔎 Search Premium Papers</h2><input id="psearch" placeholder="Search subject / paper code / year..."><div id="results"></div></section></main>
<script>const sb=supabase.createClient("YOUR_SUPABASE_URL","YOUR_SUPABASE_PUBLISHABLE_KEY");let papers=[];async function init(){let{data:{user}}=await sb.auth.getUser();if(!user){userBox.innerHTML='<p>Please login first.</p><a href="login.html">Login</a>';return}let{data:p}=await sb.from("profiles").select("*").eq("id",user.id).single();if(p?.premium_until&&new Date(p.premium_until)>new Date()){plans.style.display="none";premiumSearch.style.display="block";load()}else plans.style.display="block"}async function load(){let{data}=await sb.from("papers").select("*").order("year",{ascending:false});papers=data||[];render(papers)}function render(a){results.innerHTML=a.map(p=>`<div class="paper"><div><b>${p.title}</b><p>${p.subject} • ${p.year}</p></div><a href="${p.pdf_url}" target="_blank">📄 Open</a></div>`).join("")}psearch.oninput=()=>{let q=psearch.value.toLowerCase();render(papers.filter(p=>`${p.title} ${p.subject} ${p.paper_code} ${p.year}`.toLowerCase().includes(q)))}async function buyPlan(plan,amount){let{data:{user}}=await sb.auth.getUser();if(!user){location.href="login.html";return}alert("Payment gateway will be connected here. Use the secure server function in the next step.")}init();</script></body></html>
