<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="login"><h1>📚 WBSU Papers</h1><h2>Login / Register</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="signup()">Create Account</button><button onclick="login()">Login</button><p id="msg"></p></div><script>const sb=supabase.createClient("YOUR_SUPABASE_URL","YOUR_SUPABASE_PUBLISHABLE_KEY");function m(x){msg.innerText=x}async function signup(){let email=document.getElementById("email").value,password=document.getElementById("password").value;let{data,error}=await sb.auth.signUp({email,password});if(error)return m(error.message);if(data.user)await sb.from("profiles").upsert({id:data.user.id,email:data.user.email});m("Account created. Check email if confirmation is enabled, then login.")}async function login(){let email=document.getElementById("email").value,password=document.getElementById("password").value;let{error}=await sb.auth.signInWithPassword({email,password});if(error)return m(error.message);location.href="dashboard.html"}</script></body></html>
