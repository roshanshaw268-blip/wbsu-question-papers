<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WBSU Previous Year Question Papers</title>

  <meta
    name="description"
    content="West Bengal State University previous year question papers. Search Hindi, English, Bengali, Philosophy, History and other subjects."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #202124;
    }

    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 35px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 15px;
    }

    .container {
      max-width: 1150px;
      margin: auto;
      padding: 20px;
    }

    .search-box {
      background: white;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-top: -25px;
      position: relative;
    }

    #search {
      width: 100%;
      padding: 15px 17px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    #search:focus {
      border-color: #5b4df5;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 14px;
    }

    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 11px;
      background: white;
      font-size: 15px;
      color: #222;
      outline: none;
    }

    select:focus {
      border-color: #5b4df5;
    }

    .stats {
      margin: 22px 2px;
      font-size: 16px;
      color: #555;
    }

    .papers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    }

    .card h2 {
      font-size: 19px;
      margin-bottom: 15px;
      line-height: 1.35;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .badge {
      background: #eef2ff;
      color: #4338ca;
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 12px;
    }

    .view-btn {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      text-align: center;
      text-decoration: none;
      background: #4f46e5;
      color: white;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
    }

    .view-btn:hover {
      background: #4338ca;
    }

    .loading,
    .empty,
    .error {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 15px;
      grid-column: 1 / -1;
    }

    .error {
      color: #b91c1c;
    }

    footer {
      margin-top: 45px;
      padding: 25px;
      background: #111827;
      color: #d1d5db;
      text-align: center;
    }

    @media (max-width: 900px) {
      .papers {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      header h1 {
        font-size: 25px;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .papers {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📚 WBSU Question Papers</h1>
  <p>West Bengal State University Previous Year Question Papers</p>
</header>


<main class="container">

  <div class="search-box">

    <input
      type="search"
      id="search"
      placeholder="🔎 Search paper, subject or paper code..."
    >

    <div class="filters">

      <!-- YEARS -->
      <select id="yearFilter">
        <option value="">All Years</option>

        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
        <option value="2020">2020</option>
        <option value="2019">2019</option>
        <option value="2018">2018</option>
        <option value="2017">2017</option>
        <option value="2016">2016</option>
        <option value="2015">2015</option>
      </select>


      <!-- SUBJECTS -->
      <select id="subjectFilter">

        <option value="">All Subjects</option>

        <option value="Bengali">Bengali</option>
        <option value="English">English</option>
        <option value="Hindi">Hindi</option>
        <option value="Sanskrit">Sanskrit</option>
        <option value="Urdu">Urdu</option>

        <option value="Philosophy">Philosophy</option>
        <option value="History">History</option>
        <option value="Political Science">Political Science</option>
        <option value="Education">Education</option>
        <option value="Sociology">Sociology</option>
        <option value="Geography">Geography</option>
        <option value="Economics">Economics</option>
        <option value="Psychology">Psychology</option>

        <option value="Mathematics">Mathematics</option>
        <option value="Physics">Physics</option>
        <option value="Chemistry">Chemistry</option>
        <option value="Botany">Botany</option>
        <option value="Zoology">Zoology</option>

        <option value="Computer Science">Computer Science</option>
        <option value="Commerce">Commerce</option>

        <option value="Physical Education">
          Physical Education
        </option>

      </select>


      <!-- SEMESTER -->
      <select id="semesterFilter">

        <option value="">All Semesters</option>

        <option value="Semester I">Semester I</option>
        <option value="Semester II">Semester II</option>
        <option value="Semester III">Semester III</option>
        <option value="Semester IV">Semester IV</option>
        <option value="Semester V">Semester V</option>
        <option value="Semester VI">Semester VI</option>

      </select>

    </div>

  </div>


  <div class="stats" id="stats">
    Loading question papers...
  </div>


  <section class="papers" id="papers">

    <div class="loading">
      ⏳ Loading question papers...
    </div>

  </section>

</main>


<footer>
  © 2026 WBSU Question Papers
</footer>


<script>

  let allPapers = [];

  const search =
    document.getElementById("search");

  const yearFilter =
    document.getElementById("yearFilter");

  const subjectFilter =
    document.getElementById("subjectFilter");

  const semesterFilter =
    document.getElementById("semesterFilter");

  const papersContainer =
    document.getElementById("papers");

  const stats =
    document.getElementById("stats");


  /*
   * LOAD PAPERS
   */

  async function loadPapers() {

    try {

      const response = await fetch(
        "data/papers.json?v=" + Date.now()
      );

      if (!response.ok) {
        throw new Error("Could not load papers.json");
      }

      allPapers = await response.json();

      displayPapers(allPapers);

    } catch (error) {

      console.error(error);

      papersContainer.innerHTML = `
        <div class="error">
          ❌ Question papers could not be loaded.
          <br><br>
          Please try again later.
        </div>
      `;

      stats.textContent =
        "Unable to load question papers.";

    }

  }


  /*
   * FILTER PAPERS
   */

  function filterPapers() {

    const searchText =
      search.value.toLowerCase().trim();

    const selectedYear =
      yearFilter.value;

    const selectedSubject =
      subjectFilter.value;

    const selectedSemester =
      semesterFilter.value;


    const filtered =
      allPapers.filter(paper => {

        const searchable = [

          paper.title,
          paper.subject,
          paper.code,
          paper.type,
          paper.year,
          paper.semester

        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


        const searchMatch =
          !searchText ||
          searchable.includes(searchText);


        const yearMatch =
          !selectedYear ||
          paper.year === selectedYear;


        const subjectMatch =
          !selectedSubject ||
          paper.subject === selectedSubject;


        const semesterMatch =
          !selectedSemester ||
          paper.semester === selectedSemester;


        return (
          searchMatch &&
          yearMatch &&
          subjectMatch &&
          semesterMatch
        );

      });


    displayPapers(filtered);

  }


  /*
   * DISPLAY PAPERS
   */

  function displayPapers(papers) {

    stats.textContent =
      papers.length +
      " question paper" +
      (papers.length === 1 ? "" : "s") +
      " found";


    if (papers.length === 0) {

      papersContainer.innerHTML = `
        <div class="empty">
          🔍 No question papers found.
          <br><br>
          Try another subject, year or semester.
        </div>
      `;

      return;
    }


    papersContainer.innerHTML =
      papers.map(paper => {

        return `

          <article class="card">

            <h2>
              ${escapeHTML(
                paper.title ||
                paper.subject ||
                "Question Paper"
              )}
            </h2>


            <div class="badges">

              ${
                paper.year
                ? `
                  <span class="badge">
                    📅 ${escapeHTML(paper.year)}
                  </span>
                `
                : ""
              }


              ${
                paper.subject
                ? `
                  <span class="badge">
                    📚 ${escapeHTML(paper.subject)}
                  </span>
                `
                : ""
              }


              ${
                paper.semester
                ? `
                  <span class="badge">
                    🎓 ${escapeHTML(paper.semester)}
                  </span>
                `
                : ""
              }


              ${
                paper.type
                ? `
                  <span class="badge">
                    📄 ${escapeHTML(paper.type)}
                  </span>
                `
                : ""
              }


              ${
                paper.code
                ? `
                  <span class="badge">
                    🔖 ${escapeHTML(paper.code)}
                  </span>
                `
                : ""
              }

            </div>


            ${
              paper.url
              ? `
                <a
                  class="view-btn"
                  href="${escapeHTML(paper.url)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  👁️ View Paper
                </a>
              `
              : ""
            }

          </article>

        `;

      }).join("");

  }


  /*
   * SECURITY
   */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * EVENTS
   */

  search.addEventListener(
    "input",
    filterPapers
  );

  yearFilter.addEventListener(
    "change",
    filterPapers
  );

  subjectFilter.addEventListener(
    "change",
    filterPapers
  );

  semesterFilter.addEventListener(
    "change",
    filterPapers
  );


  /*
   * START
   */

  loadPapers();

</script>

</body>
</html>
